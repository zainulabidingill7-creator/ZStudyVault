name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          mkdir -p project
          unzip -o StudyMate-GitHub-APK-Ready.zip -d project

      - name: Find Gradle project
        run: |
          find project -name gradlew -type f

      - name: Build APK
        run: |
          GRADLEW=$(find project -name gradlew -type f | head -1)
          chmod +x "$GRADLEW"
          cd "$(dirname "$GRADLEW")"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyMate-APK
          path: project/**/build/outputs/apk/**/*.apk
