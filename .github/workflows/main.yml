name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find project ZIP
        run: |
          ZIP=$(find . -maxdepth 2 -name "*.zip" | head -1)
          echo "ZIP=$ZIP" >> $GITHUB_ENV

      - name: Extract project ZIP
        run: |
          mkdir -p project
          unzip -o "$ZIP" -d project

      - name: Find Gradle project
        run: |
          GRADLEW=$(find project -name gradlew -type f | head -1)
          chmod +x "$GRADLEW"
          echo "GRADLEW=$GRADLEW" >> $GITHUB_ENV
          echo "PROJECT_DIR=$(dirname "$GRADLEW")" >> $GITHUB_ENV

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyMate-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
